<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <!-- Primary Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live E-commerce - Tu Tienda Online de Moda y Accesorios</title>
    <meta name="title" content="Live E-commerce - Tu Tienda Online de Moda y Accesorios" />
    <meta name="description" content="Descubre las mejores ofertas en moda, accesorios, zapatos y más. Compra online con envío rápido y devoluciones gratis. ¡Ofertas especiales todos los días!" />
    <meta name="keywords" content="moda online, tienda de ropa, accesorios, zapatos, ofertas, compras online, e-commerce" />
    <meta name="author" content="Live E-commerce" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://live-ecommerce.com/" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="apple-touch-icon" href="/vite.svg" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://live-ecommerce.com/" />
    <meta property="og:title" content="Live E-commerce - Tu Tienda Online de Moda y Accesorios" />
    <meta property="og:description" content="Descubre las mejores ofertas en moda, accesorios, zapatos y más. Compra online con envío rápido y devoluciones gratis." />
    <meta property="og:image" content="https://live-ecommerce.com/images/hero-background.png" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:site_name" content="Live E-commerce" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://live-ecommerce.com/" />
    <meta property="twitter:title" content="Live E-commerce - Tu Tienda Online de Moda y Accesorios" />
    <meta property="twitter:description" content="Descubre las mejores ofertas en moda, accesorios, zapatos y más. Compra online con envío rápido y devoluciones gratis." />
    <meta property="twitter:image" content="https://live-ecommerce.com/images/hero-background.png" />

    <!-- Preconnect to external resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- DNS Prefetch -->
    <link rel="dns-prefetch" href="https://www.google-analytics.com" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />

    <!-- Schema.org JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Live E-commerce",
      "url": "https://live-ecommerce.com/",
      "description": "Tu tienda online de moda y accesorios",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://live-ecommerce.com/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Live E-commerce",
      "url": "https://live-ecommerce.com/",
      "logo": "https://live-ecommerce.com/vite.svg",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Servicio al Cliente",
        "availableLanguage": ["Spanish"]
      },
      "sameAs": [
        "https://www.facebook.com/liveecommerce",
        "https://www.instagram.com/liveecommerce",
        "https://twitter.com/liveecommerce"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
